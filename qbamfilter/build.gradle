apply plugin: 'application'

mainClassName = 'org.qcmg.qbamfilter.query.Query'
def scriptname = 'qbamfilter'
def isExecutable = true

dependencies {

    implementation project(':qcommon')
    implementation project(':qpicard')

    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    implementation 'org.antlr:antlr:3.2'
}


// micro-benchmark of QueryExecutor: ./gradlew :qbamfilter:benchmark [-Pbam=/path/to.bam] [-Ppasses=N]
task benchmark(type: JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.qcmg.qbamfilter.query.QueryExecutorBenchmark'
    args = [project.findProperty('bam') ?: '../qsv/src/resources/example.test.bam', project.findProperty('passes') ?: '200']
}
